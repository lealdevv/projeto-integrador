<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtor | Feira Local</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Feira Local</h1>
    <nav>
      <a href="index.html">Catálogo</a>
      <a href="cadastro-produtor.html" class="ativo">Cadastrar produtor</a>
      <a href="cadastro-produto.html">Cadastrar produto</a>
    </nav>
  </header>

  <main class="container">
    <section class="cartao">
      <h2>Cadastro de produtor</h2>
      <form id="form-produtor" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Maria da Silva">
          <span class="erro" data-erro="nome"></span>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Ex: Sumaré">
          <span class="erro" data-erro="cidade"></span>
        </div>

        <div class="campo">
          <label for="whatsapp">WhatsApp (com DDD)</label>
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="Ex: 19999998888">
          <span class="erro" data-erro="whatsapp"></span>
        </div>

        <button type="submit" class="botao">Cadastrar produtor</button>
        <p id="mensagem" class="mensagem" role="status"></p>
      </form>
    </section>

    <section class="cartao">
      <h2>Produtores cadastrados</h2>
      <ul id="lista-produtores" class="lista"></ul>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/produtores.js"></script>
</body>
</html>
